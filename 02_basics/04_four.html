<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit and remove DOM elements</title>
</head>
<body style ="font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 20px;">

        <ul class ="languages">
        <li>JavaScript</li>
        </ul>
</body>
<script>
    function addlanguage(langName){
        const li= document.createElement('li');
        li.innerHTML= `${langName}`;
        document.querySelector('.languages').appendChild(li);

        

    }
    addlanguage('Python');
    addlanguage('C++');

    function addOptLanguage(langName){
        const li= document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.languages').appendChild(li);
    }
    addOptLanguage('Java');
    addOptLanguage('Ruby');


    //Edit
    const secondlang =document.querySelector("li:nth-child(2)");
    console.log(secondlang);
    // secondlang.innerHTML = "Go";
    const newli = document.createElement('li');
    newli.textContent = "TypeScript";
    secondlang.replaceWith(newli);

    //edit 2
    const firstlang = document.querySelector("li:first-child");
    firstlang.outerHTML = "<li>HTML</li>";
    // //remove
    // const thirdlang = document.querySelector("li:nth-child(3)");
    // thirdlang.remove();
    //remove 2
    const langlist = document.querySelector('.languages');
    const fourthlang = document.querySelector("li:nth-child(4)");
    langlist.removeChild(fourthlang);


</script>
</html>
